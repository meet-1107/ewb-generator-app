# Copy to deploy/env.yaml (git-ignored), fill in, then run: bash deploy/cloudrun.sh
# Values must stay in quotes.

# Required
FIREBASE_PROJECT_ID: "ewb---generator"
GSTINAPI_KEY: "gak_your_key"
EWB_PROVIDER: "gstinapi"
GSTINAPI_TEST_MODE: "true"          # "false" only after a TEST- bill worked
RESEND_API_KEY: "re_your_key"
EMAIL_FROM: "E-Way Easy <onboarding@resend.dev>"   # use your verified domain later

# Credits
WALLET_START_CREDITS: "0"
CREDIT_PRICE_PAISE: "100"           # 1 credit = ₹1
CREDIT_COSTS_JSON: '{"generate":10,"part_b":5,"consolidate":5,"cancel":5,"extend":5}'
CREDIT_PACKS_JSON: '[100,250,500,1000,2500]'

# Optional: Razorpay (leave empty until you have keys)
RAZORPAY_KEY_ID: ""
RAZORPAY_KEY_SECRET: ""
RAZORPAY_WEBHOOK_SECRET: ""

# OTP_PEPPER, EWB_CREDENTIALS_SECRET and WALLET_ADMIN_TOKEN are generated by
# cloudrun.sh on the first run and saved in deploy/secrets.env — keep that file.
