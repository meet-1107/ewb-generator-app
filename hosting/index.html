<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-Way Easy</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f7f9; --fg: #1b1f24; --muted: #5b6470; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111418; --fg: #eef1f4; --muted: #9aa4af; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 420px; text-align: center; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>E-Way Easy</h1>
  <p>GST e-way bills on your phone. Use the E-Way Easy Android app to sign in.</p>
</main>
</body>
</html>
